# Porta padrão do servidor web
server.port=8080

# Conexão com o MySQL 8+ (Schema obrigatório: arenaxp_db)
spring.datasource.url=jdbc:mysql://localhost:3306/arenaxp_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração do Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Fuso horário para serialização de datas (LocalDateTime) nas APIs REST
spring.jackson.time-zone=America/Sao_Paulo

# Exibição de mensagens claras nos retornos de erro da API
server.error.include-message=always

# Configuração de cookie de sessão para comunicação entre portas locais (Live Server + Spring Boot)
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true

# Senha do administrador padrão criado pelo DataInitializer
arenaxp.admin.password=${ARENAXP_ADMIN_PASSWORD:ArenaXP@2026#Admin}
